    <script>
      // Safe guard against iframe permissions-policy rejection on wakeLock
      if (typeof navigator !== 'undefined' && navigator.wakeLock && typeof navigator.wakeLock.request === 'function') {
        try {
          const _origWakeLock = navigator.wakeLock.request.bind(navigator.wakeLock);
          navigator.wakeLock.request = async function (type) {
            try {
              return await _origWakeLock(type);
            } catch (err) {
              return {
                released: false,
                type: type || 'screen',
                release: async function () {},
                addEventListener: function () {},
                removeEventListener: function () {},
                dispatchEvent: function () { return true; }
              };
            }
          };
        } catch (_) {}
      }
    </script>
